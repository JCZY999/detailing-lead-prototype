<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test booking · Desert Shine</title>
<style>body{font:18px system-ui;max-width:650px;margin:70px auto;padding:24px;background:#101d24;color:#e8f2ed}p{line-height:1.6}input,button{font:inherit;padding:14px;border-radius:8px;margin:12px 0}button{background:#8bf0be;border:0;cursor:pointer}a{color:#8bf0be}#summary{white-space:pre-wrap}</style>
<h1>Your test booking</h1><p>This saves a simulated booking request. It does not reserve a date or time with a real shop.</p><p id="summary">Loading details…</p><form id="form"><label for="name">Your name</label><br><input id="name" required maxlength="100" autocomplete="name"><br><button id="save" disabled>Save test booking</button></form><p id="status" role="status"></p><a href="/">Return to conversation</a>
<script>const cid=location.pathname.split('/').pop();const el=id=>document.getElementById(id);fetch('/conversations/'+cid).then(async r=>{if(!r.ok)throw Error('Conversation unavailable');return r.json()}).then(d=>{const p=d.booking?JSON.parse(d.booking.details):d.profile;el('summary').textContent=`Service: ${p.service||'needed'}\nVehicle: ${p.vehicle||'needed'}\nBrand: ${p.brand||'needed'}\nDemo total: ${p.quote?'$'+p.quote.total_usd:(p.price_usd!==undefined?'$'+p.price_usd:'quote needed')}\nPreferred day: ${p.day||'needed'}`;el('save').disabled=!(p.quote&&p.day&&p.day!=='sunday');if(el('save').disabled)el('status').textContent='Return to the conversation to finish qualification.';if(d.booking){el('save').disabled=true;el('status').textContent='Test booking already saved: '+d.booking.id}}).catch(e=>el('status').textContent=e.message);el('form').onsubmit=async e=>{e.preventDefault();el('save').disabled=true;try{const r=await fetch('/book/'+cid,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:el('name').value})});const d=await r.json();if(!r.ok)throw Error(JSON.stringify(d.detail));el('status').textContent='Test booking saved. Reference: '+d.booking_id}catch(e){el('status').textContent=e.message;el('save').disabled=false}};</script></html>
