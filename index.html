<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desert Shine · Lead lab</title>
<style>body{font:17px system-ui;background:#101d24;color:#e8f2ed;max-width:850px;margin:50px auto;padding:24px}h1{font-size:44px;margin:10px 0}p{line-height:1.6;color:#bfcec9}small{color:#7de0b4}article{padding:18px;border:1px solid #3c555e;border-radius:12px;margin:12px 0;white-space:pre-wrap}textarea,input{box-sizing:border-box;width:100%;padding:16px;border-radius:10px;font:inherit}button,a{background:#8bf0be;color:#10241a;border:0;border-radius:8px;padding:12px 18px;font:inherit;cursor:pointer;display:inline-block;margin:12px 6px 12px 0}#status{color:#f5cc84}#booking{display:none}label{display:block;margin:12px 0}</style>
<small>DESERT SHINE / LOCAL PROTOTYPE</small><h1>Turn an inquiry into a booking.</h1><p>Interior $149 · Exterior $89 · Full detail $219<br>Mon–Sat, 9 AM–5 PM · Phoenix time · Sunday closed</p><p>Conversation simulator. No live AI, SMS, payments, or real appointments.</p>
<div id="messages" aria-live="polite"></div><form id="chat"><label for="message">Customer message</label><textarea id="message" maxlength="2000" required rows="3">Hi, I want an interior detail this weekend.</textarea><button id="send">Send message</button><button type="button" id="reset">New conversation</button></form><div id="status" role="status"></div><a id="booking" target="_blank" rel="noopener">Open test booking</a>
<script>
let cid=localStorage.getItem('desert-shine-conversation');
const el=id=>document.getElementById(id);
function add(role,text){const row=document.createElement('article');row.textContent=(role==='user'?'YOU\n':'DESERT SHINE\n')+text;el('messages').append(row)}
function link(){el('booking').href='/book/'+cid;el('booking').style.display='inline-block'}
async function restore(){if(!cid)return;try{const r=await fetch('/conversations/'+cid);if(!r.ok)throw Error('Saved conversation unavailable. Start a new conversation.');const d=await r.json();d.messages.forEach(m=>add(m.role,m.content));link()}catch(e){el('status').textContent=e.message}}
el('chat').onsubmit=async e=>{e.preventDefault();const message=el('message').value.trim();if(!message)return;el('send').disabled=true;el('reset').disabled=true;el('status').textContent='Saving conversation…';try{const r=await fetch('/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,conversation_id:cid})});const d=await r.json();if(!r.ok)throw Error(JSON.stringify(d.detail));cid=d.conversation_id;localStorage.setItem('desert-shine-conversation',cid);add('user',message);add('assistant',d.reply);el('message').value='';el('status').textContent=d.qualified?'Qualified · ready for a test booking':'Saved · qualification in progress';link()}catch(e){el('status').textContent=e.message}finally{el('send').disabled=false;el('reset').disabled=false}};
el('reset').onclick=()=>{cid=null;localStorage.removeItem('desert-shine-conversation');el('messages').replaceChildren();el('booking').style.display='none';el('status').textContent='New conversation ready.'};restore();
</script></html>
